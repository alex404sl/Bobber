[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bobber"
version = "0.1.0"
description = "Monitors an Evilginx database and replays captured ESTS cookies with roadtx"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "colorama",
    "paramiko",
    "requests",
    "roadlib",
    "roadtx",
]

[project.scripts]
bobber = "bobber:main"

[tool.setuptools]
py-modules = ["bobber"]
